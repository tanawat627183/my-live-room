<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEAR LIVE - ไลฟ์สดอิสระ</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-red: #f43f5e;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        nav {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .logo span { color: var(--accent-red); }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }
        
        .hero-text {
            text-align: center;
            margin-bottom: 30px;
        }
        .hero-text h1 { font-size: 26px; margin-bottom: 8px; font-weight: 700; }
        .hero-text p { color: var(--text-muted); font-size: 14px; margin: 0; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h2 { font-size: 18px; margin-top: 0; color: #fff; margin-bottom: 15px; }

        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .input-group input:focus { border-color: var(--accent-blue); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .btn:hover { opacity: 0.9; }
        .btn-live { background-color: var(--accent-red); color: white; }
        .btn-watch { background-color: var(--accent-blue); color: white; }

        .room-list-box {
            background: var(--card-bg);
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 25px;
        }
        .room-item {
            background: #1f2937;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border: 1px solid #374151;
        }
        .room-info h4 { margin: 0 0 4px 0; font-size: 16px; color: #fff; }
        .room-info span { font-size: 12px; color: var(--accent-red); font-weight: bold; }

        footer {
            text-align: center;
            padding: 20px;
            color: #4b5563;
            font-size: 13px;
            border-top: 1px solid #1f2937;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div style="display: flex; flex-direction: column; min-height: 100vh;">
        <nav>
            <div class="logo">DEAR<span>LIVE</span></div>
        </nav>

        <div class="container">
            <div class="hero-text">
                <h1>แพลตฟอร์มไลฟ์สดอิสระ</h1>
                <p>สร้างห้องปุ๊บ ชื่อห้องเด้งขึ้นลิสต์ให้คนอื่นกดดูได้ทันที</p>
            </div>

            <div class="grid">
                <!-- ฝั่งเปิดห้องไลฟ์ -->
                <div class="card" style="border-top: 4px solid var(--accent-red);">
                    <div>
                        <h2>🔴 เปิดห้องไลฟ์ใหม่</h2>
                        <div class="input-group">
                            <label>ตั้งชื่อห้องของคุณ</label>
                            <input type="text" id="myRoomName" placeholder="เช่น ขายปลา, ห้องของฉัน">
                        </div>
                    </div>
                    <button onclick="startMyLive()" class="btn btn-live">เปิดห้องไลฟ์ทันที</button>
                </div>

                <!-- ฝั่งผู้ชม -->
                <div class="card" style="border-top: 4px solid var(--accent-blue);">
                    <div>
                        <h2>👀 ข้อมูลสำหรับผู้ชม</h2>
                        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 15px;">
                            เลือกห้องจากรายการด้านล่างเพื่อคลิกดูได้ทันที ไม่ต้องใส่รหัส
                        </p>
                    </div>
                </div>
            </div>

            <!-- รายการห้องที่จะแสดงผลแบบอัปเดตอัตโนมัติ -->
            <div class="room-list-box">
                <h2 style="margin-top:0; font-size:18px; color:#fff; margin-bottom:15px;">📺 รายการห้องที่เปิดไลฟ์อยู่</h2>
                <div class="room-list" id="roomContainer">
                    <!-- รายการห้องจะถูกเติมอัตโนมัติจากโค้ดด้านล่าง -->
                </div>
            </div>
        </div>

        <footer>
            <p>© 2026 DEAR LIVE PLATFORM • ใช้งานง่าย ดูคือดูเลย</p>
        </footer>
    </div>

    <script>
        // โหลดรายการห้องเริ่มต้น
        let defaultRooms = [
            { name: "General", label: "ห้องหลัก: ทั่วไป (General)" },
            { name: "Market", label: "ห้องที่ 2: ตลาดนัด (Market)" },
            { name: "Party", label: "ห้องที่ 3: ปาร์ตี้ (Party)" }
        ];

        function getRooms() {
            let saved = localStorage.getItem('dear_live_rooms');
            if (saved) {
                return JSON.parse(saved);
            }
            return defaultRooms;
        }

        function renderRooms() {
            let rooms = getRooms();
            let container = document.getElementById('roomContainer');
            container.innerHTML = "";

            rooms.forEach(r => {
                let html = `
                    <div class="room-item">
                        <div class="room-info">
                            <h4>${r.label}</h4>
                            <span>● พร้อมดูทันที</span>
                        </div>
                        <button onclick="watchRoom('${r.name}')" class="btn btn-watch" style="width: auto; padding: 10px 20px;">คลิกดูเลย</button>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function startMyLive() {
            let room = document.getElementById('myRoomName').value.trim();
            if(!room) { alert("กรุณาตั้งชื่อห้องก่อนครับ"); return; }
            let cleanRoom = room.replace(/\s+/g, '-');
            
            // บันทึกห้องใหม่ลงในความจำ เพื่อให้ชื่อห้องเด้งขึ้นลิสต์
            let rooms = getRooms();
            // เช็คว่ามีห้องชื่อนี้ยัง ถ้ายังไม่มีให้เพิ่มเข้าไป
            if(!rooms.some(r => r.name === cleanRoom)) {
                rooms.unshift({ name: cleanRoom, label: "ห้อง: " + room });
                localStorage.setItem('dear_live_rooms', JSON.stringify(rooms));
            }

            renderRooms();

            // เปิดหน้าจอไลฟ์ทันที
            let url = `https://vdo.ninja/?push=${cleanRoom}&quality=0`;
            window.open(url, '_blank');
        }

        function watchRoom(roomName) {
            let url = `https://vdo.ninja/?view=${roomName}`;
            window.open(url, '_blank');
        }

        // โหลดแสดงผลตอนเปิดเว็บครั้งแรก
        renderRooms();
    </script>

</body>
</html>
