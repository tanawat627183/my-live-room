<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEAR LIVE - แพลตฟอร์มไลฟ์สดและแชทสด</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-red: #f43f5e;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        nav {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .logo span { color: var(--accent-red); }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }
        
        .hero-text {
            text-align: center;
            margin-bottom: 30px;
        }
        .hero-text h1 { font-size: 26px; margin-bottom: 8px; font-weight: 700; }
        .hero-text p { color: var(--text-muted); font-size: 14px; margin: 0; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h2 { font-size: 18px; margin-top: 0; color: #fff; margin-bottom: 15px; }

        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .input-group input:focus { border-color: var(--accent-blue); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .btn:hover { opacity: 0.9; }
        .btn-live { background-color: var(--accent-red); color: white; }
        .btn-watch { background-color: var(--accent-blue); color: white; }
        .btn-end { background-color: #374151; color: #f87171; margin-top: 10px; }

        .room-list-box {
            background: var(--card-bg);
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 25px;
        }
        .room-item {
            background: #1f2937;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border: 1px solid #374151;
        }
        .room-info h4 { margin: 0 0 4px 0; font-size: 16px; color: #fff; }
        .room-info span { font-size: 12px; color: var(--accent-red); font-weight: bold; }

        .empty-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            padding: 20px 0;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #4b5563;
            font-size: 13px;
            border-top: 1px solid #1f2937;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div style="display: flex; flex-direction: column; min-height: 100vh;">
        <nav>
            <div class="logo">DEAR<span>LIVE</span></div>
        </nav>

        <div class="container">
            <div class="hero-text">
                <h1>แพลตฟอร์มไลฟ์สดและแชทสดอิสระ</h1>
                <p>สร้างห้องปุ๊บ ขึ้นลิสต์ให้คนดูคลิกดูและแชทได้ทันที</p>
            </div>

            <div class="grid">
                <!-- ฝั่งเปิดห้องไลฟ์ -->
                <div class="card" style="border-top: 4px solid var(--accent-red);">
                    <div>
                        <h2>🔴 เปิดห้องไลฟ์ใหม่</h2>
                        <div class="input-group">
                            <label>ตั้งชื่อห้องของคุณ</label>
                            <input type="text" id="myRoomName" placeholder="เช่น sale-fish, room1">
                        </div>
                    </div>
                    <div>
                        <button onclick="startMyLive()" class="btn btn-live">เปิดห้องไลฟ์ทันที</button>
                        <button onclick="endMyLive()" class="btn btn-end">🛑 ปิดห้อง / เลิกไลฟ์</button>
                    </div>
                </div>

                <!-- ฝั่งผู้ชม -->
                <div class="card" style="border-top: 4px solid var(--accent-blue);">
                    <div>
                        <h2>👀 ข้อมูลสำหรับผู้ชม</h2>
                        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 15px;">
                            กรอกชื่อเล่นของคุณก่อน แล้วเลือกห้องด้านล่างเพื่อคลิกดูและพิมพ์แชทได้ทันที
                        </p>
                        <div class="input-group">
                            <label>ชื่อเล่นของคุณ (สำหรับแสดงในแชท)</label>
                            <input type="text" id="viewerNickName" placeholder="เช่น น้องฟ้า, ลูกค้า">
                        </div>
                    </div>
                </div>
            </div>

            <!-- รายการห้องสดๆ -->
            <div class="room-list-box">
                <h2 style="margin-top:0; font-size:18px; color:#fff; margin-bottom:15px;">📺 รายการห้องที่กำลังไลฟ์อยู่</h2>
                <div class="room-list" id="roomContainer">
                    <!-- รายการห้องจะแสดงตรงนี้อัตโนมัติ -->
                </div>
            </div>
        </div>

        <footer>
            <p>© 2026 DEAR LIVE PLATFORM • ไลฟ์สดอิสระ มีแชทสดในตัว</p>
        </footer>
    </div>

    <script>
        function getRooms() {
            let saved = localStorage.getItem('dear_live_chat_rooms');
            if (saved) {
                return JSON.parse(saved);
            }
            return [];
        }

        function renderRooms() {
            let rooms = getRooms();
            let container = document.getElementById('roomContainer');
            container.innerHTML = "";

            if (rooms.length === 0) {
                container.innerHTML = `<div class="empty-text">ยังไม่มีห้องไลฟ์ในขณะนี้ สามารถเปิดห้องใหม่ด้านบนได้เลยครับ</div>`;
                return;
            }

            rooms.forEach(r => {
                let html = `
                    <div class="room-item">
                        <div class="room-info">
                            <h4>ห้อง: ${r.label}</h4>
                            <span>● กำลังออนแอร์ (พร้อมแชท)</span>
                        </div>
                        <button onclick="watchRoom('${r.name}')" class="btn btn-watch" style="width: auto; padding: 10px 20px;">คลิกดูและแชท</button>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        let currentActiveRoom = "";

        function startMyLive() {
            let room = document.getElementById('myRoomName').value.trim();
            if(!room) { alert("กรุณาตั้งชื่อห้องก่อนครับ"); return; }
            let cleanRoom = room.replace(/\s+/g, '-');
            
            currentActiveRoom = cleanRoom;

            let rooms = getRooms();
            if(!rooms.some(r => r.name === cleanRoom)) {
                rooms.unshift({ name: cleanRoom, label: room });
                localStorage.setItem('dear_live_chat_rooms', JSON.stringify(rooms));
            }

            renderRooms();

            // เปิดหน้าจอไลฟ์ฝั่งเจ้าของห้อง
            let url = `https://vdo.ninja/?push=${cleanRoom}&quality=0`;
            window.open(url, '_blank');
        }

        function endMyLive() {
            let roomInput = document.getElementById('myRoomName').value.trim();
            let targetRoom = roomInput ? roomInput.replace(/\s+/g, '-') : currentActiveRoom;

            if(!targetRoom) {
                alert("กรุณาใส่ชื่อห้องที่คุณเปิดไลฟ์อยู่ เพื่อกดปิดครับ");
                return;
            }

            let rooms = getRooms();
            let updatedRooms = rooms.filter(r => r.name !== targetRoom);
            localStorage.setItem('dear_live_chat_rooms', JSON.stringify(updatedRooms));

            renderRooms();
            alert("ปิดห้องไลฟ์เรียบร้อยแล้ว ห้องถูกลบออกจากระบบและหายไปจากหน้าจอคนดูแล้วครับ!");
        }

        function watchRoom(roomName) {
            let name = document.getElementById('viewerNickName').value.trim();
            if(!name) {
                alert("กรุณากรอก 'ชื่อเล่นของคุณ' ในช่องด้านบนก่อนคลิกดูครับ");
                document.getElementById('viewerNickName').focus();
                return;
            }

            // ลิงก์สำหรับผู้ชม พร้อมเปิดแชทสดและส่งชื่อเล่นเข้าไป
            let url = `https://vdo.ninja/?room=${roomName}&chatbutton&label&displayName=${encodeURIComponent(name)}`;
            window.open(url, '_blank');
        }

        // โหลดเช็กลิสต์ห้องตอนเปิดเว็บ
        renderRooms();
    </script>

</body>
</html>
