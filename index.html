<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEAR LIVE - ศูนย์รวมห้องไลฟ์สด</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-red: #f43f5e;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* Navbar */
        nav {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .logo span { color: var(--accent-red); }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }
        
        .hero-text {
            text-align: center;
            margin-bottom: 30px;
        }
        .hero-text h1 { font-size: 28px; margin-bottom: 8px; font-weight: 700; }
        .hero-text p { color: var(--text-muted); font-size: 15px; margin: 0; }

        /* Card Section */
        .card {
            background: var(--card-bg);
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .card h2 { font-size: 18px; margin-top: 0; color: #fff; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        /* Inputs */
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .input-group input:focus { border-color: var(--accent-blue); }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-live { background-color: var(--accent-red); color: white; }
        .btn-watch { background-color: var(--accent-blue); color: white; }

        /* Active Rooms List */
        .room-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .room-item {
            background: #1f2937;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #374151;
        }
        .room-info h4 { margin: 0 0 5px 0; font-size: 16px; color: #fff; }
        .room-info span { font-size: 12px; color: var(--accent-red); font-weight: bold; }
        .btn-join-small {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Live Room View (Hidden by default, shown when streaming/watching) */
        #liveView {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0f19;
            z-index: 100;
            flex-direction: column;
        }
        .live-header {
            background: #111827;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }
        .btn-back {
            background: #374151;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }
        iframe { width: 100%; height: 100%; border: none; }

        footer {
            text-align: center;
            padding: 20px;
            color: #4b5563;
            font-size: 13px;
            border-top: 1px solid #1f2937;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- หน้าแรก: ศูนย์รวมห้องไลฟ์ -->
    <div id="homeView" style="display: flex; flex-direction: column; min-height: 100vh;">
        <nav>
            <div class="logo">DEAR<span>LIVE</span></div>
        </nav>

        <div class="container">
            <div class="hero-text">
                <h1>ศูนย์รวมห้องไลฟ์สดส่วนตัว</h1>
                <p>สร้างห้องไลฟ์ของคุณเอง หรือเลือกห้องเพื่อเข้าชมได้ทันทีโดยไม่ต้องล็อกอิน</p>
            </div>

            <!-- โซนสร้างห้องไลฟ์ของคุณเอง -->
            <div class="card" style="border-top: 4px solid var(--accent-red);">
                <h2>🔴 เปิดห้องไลฟ์ของคุณเอง</h2>
                <div class="input-group">
                    <label>ตั้งชื่อห้องไลฟ์ของคุณ (เช่น ห้องคุณเดียร์, ขายเสื้อผ้า)</label>
                    <input type="text" id="createRoomName" placeholder="ใส่ชื่อห้องเป็นภาษาอังกฤษหรือตัวเลข เช่น dear-shop">
                </div>
                <div class="input-group">
                    <label>ชื่อผู้จัด (ชื่อของคุณ)</label>
                    <input type="text" id="createHostName" value="คุณเดียร์" placeholder="ชื่อที่จะแสดงในไลฟ์">
                </div>
                <button onclick="startMyLive()" class="btn btn-live">เริ่มไลฟ์สดทันที</button>
            </div>

            <!-- โซนห้องยอดฮิต / ห้องหลักของคุณเดียร์ -->
            <div class="card" style="border-top: 4px solid var(--accent-blue);">
                <h2>👀 ห้องไลฟ์ที่กำลังออนแอร์</h2>
                
                <div class="input-group">
                    <label>ชื่อเล่นของคุณ (สำหรับเข้าชมและพิมพ์แชท)</label>
                    <input type="text" id="viewerName" placeholder="เช่น น้องฟ้า, ลูกค้าทั่วไป">
                </div>

                <div class="room-list">
                    <div class="room-item">
                        <div class="room-info">
                            <h4 id="mainRoomTitle">🔴 ห้องหลัก: คุณเดียร์ (KhunDearLiveRoom2026)</h4>
                            <span>● กำลังออนแอร์</span>
                        </div>
                        <button onclick="joinRoom('KhunDearLiveRoom2026')" class="btn-join-small">เข้าชม</button>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>© 2026 DEAR LIVE PLATFORM • อิสระ ปลอดภัย ไม่โดนแบน</p>
        </footer>
    </div>

    <!-- หน้าจอห้องไลฟ์ (แสดงผลเต็มจอเมื่อกดเข้ามา) -->
    <div id="liveView">
        <div class="live-header">
            <button onclick="leaveRoom()" class="btn-back">← ออกจากห้องไลฟ์</button>
            <span id="currentRoomDisplay" style="font-weight: bold; color: #f3f4f6;">กำลังไลฟ์สด</span>
            <div style="width: 80px;"></div>
        </div>
        <div class="iframe-container" id="iframeBox"></div>
    </div>

    <script>
        function startMyLive() {
            let room = document.getElementById('createRoomName').value.trim();
            let host = document.getElementById('createHostName').value.trim();
            
            if(!room) {
                alert("กรุณาตั้งชื่อห้องก่อนครับ");
                return;
            }
            // แปลงชื่อห้องให้ไม่มีเว้นวรรค
            room = room.replace(/\s+/g, '-');
            if(!host) host = "สตรีมเมอร์";

            // ลิงก์สำหรับเจ้าห้อง (เปิดกล้อง/ไมค์)
            let jitsiUrl = `https://meet.jit.si/${room}#userInfo.displayName="${encodeURIComponent(host)}"&config.startWithAudioMuted=false&config.startWithVideoMuted=false&interfaceConfig.DEFAULT_LANGUAGE=th&interfaceConfig.TOOLBAR_BUTTONS=['microphone','camera','chat','desktop','raisehand','tileview','fullscreen']`;
            
            openLiveScreen(room, jitsiUrl);
        }

        function joinRoom(room) {
            let viewer = document.getElementById('viewerName').value.trim();
            if(!viewer) {
                alert("กรุณากรอก 'ชื่อเล่นของคุณ' ก่อนเข้าชมครับ");
                return;
            }

            // ลิงก์สำหรับผู้ชม (ปิดกล้อง/ไมค์อัตโนมัติ ให้พิมพ์แชทและดูได้อย่างเดียว)
            let jitsiUrl = `https://meet.jit.si/${room}#userInfo.displayName="${encodeURIComponent(viewer)}"&config.startWithAudioMuted=true&config.startWithVideoMuted=true&interfaceConfig.DEFAULT_LANGUAGE=th&interfaceConfig.TOOLBAR_BUTTONS=['chat','raisehand','tileview','fullscreen']`;

            openLiveScreen(room, jitsiUrl);
        }

        function openLiveScreen(roomName, url) {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('liveView').style.display = 'flex';
            document.getElementById('currentRoomDisplay').innerText = "ห้อง: " + roomName;
            
            let box = document.getElementById('iframeBox');
            box.innerHTML = `<iframe src="${url}" allow="camera; microphone; fullscreen; display-capture"></iframe>`;
        }

        function leaveRoom() {
            document.getElementById('liveView').style.display = 'none';
            document.getElementById('homeView').style.display = 'flex';
            document.getElementById('iframeBox').innerHTML = ''; // ปิดวิดีโอเคลียร์ระบบ
        }
    </script>

</body>
</html>
