<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ห้องไลฟ์สดส่วนตัว</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 { color: #ef4444; margin: 0 0 5px 0; }
        p { color: #94a3b8; font-size: 14px; margin: 0; }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .video-box {
            flex: 2;
            min-width: 300px;
            height: 550px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
        }
        .chat-box {
            flex: 1;
            min-width: 280px;
            height: 550px;
            background: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .chat-frame {
            flex: 1;
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🔴 LIVE STREAMING ROOM</h1>
        <p>ห้องไลฟ์สดส่วนตัว ไม่โดนแบน ควบคุมเองได้ 100%</p>
    </header>

    <div class="container">
        <!-- ฝั่งจอวิดีโอไลฟ์ -->
        <div class="video-box">
            <iframe src="https://meet.jit.si/KhunDearLiveRoom2026#config.startWithAudioMuted=false&config.startWithVideoMuted=false" allow="camera; microphone; fullscreen; display-capture"></iframe>
        </div>

        <!-- ฝั่งช่องแชท -->
        <div class="chat-box">
            <h3 style="margin:0; font-size:16px;">💬 แชทพูดคุย</h3>
            <div class="chat-frame">
                <iframe src="https://www3.cbox.ws/box/?boxid=954756&boxtag=livechat" allowtransparency="yes" allow="autoplay"></iframe>
            </div>
        </div>
    </div>

</body>
</html>
